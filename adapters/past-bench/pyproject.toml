[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[project]
name = "agent-infra-past-bench"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-infra==0.1.0",
  "past-bench @ git+https://github.com/Gen-Verse/PAST-Bench.git@f8223517ae7491e776b69793d9f11e9d074ab42e",
]

[project.entry-points."agent_infra.benchmarks.v1"]
past-bench = "agent_infra_past_bench:Adapter"
