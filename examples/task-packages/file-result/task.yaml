schema_version: 1
task_id: example-file-result
revision: "1"
mode: research
source:
  kind: user
instructions: [instruction]
materials:
  - id: instruction
    role: instruction
    kind: file
    source: instruction.md
    description: Task goal and output contract
    audiences: [solver, evaluator, controller]
    target: instruction.md
    access: read_only
    provenance: {origin: user}
  - id: input
    role: data
    kind: directory
    source: data
    description: Supplied text input
    audiences: [solver, evaluator, controller]
    target: data
    access: read_only
    provenance: {origin: user}
  - id: expected
    role: evaluation_asset
    kind: file
    source: private/expected.txt
    description: Private fixture answer
    audiences: [evaluator, controller]
    provenance: {origin: user}
outputs:
  state: specified
  items:
    - path: result.txt
      required: true
      provenance: {origin: user, evidence: instruction}
evaluation:
  state: specified
  evaluator_ref: example:text-exact-v1
  audiences: [evaluator, controller]
  feedback: after_submission
resource_intent:
  state: specified
  constraints: {cpu_min: 1, cpu_max: 2, memory_min: 128MiB}
  provenance: {origin: user, evidence: fixture-policy}
