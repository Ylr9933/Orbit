schema_version: 1
task_id: example-nested-research
revision: draft-1
mode: research
source: {kind: user}
instructions: [goal]
materials:
  - id: goal
    role: instruction
    kind: file
    source: docs/goal.md
    description: Original user instruction
    audiences: [solver, evaluator, controller]
    target: docs/goal.md
    provenance: {origin: user}
  - id: measurements
    role: data
    kind: file
    source: inputs/measurements.csv
    description: Supplied measurements
    audiences: [solver, evaluator, controller]
    target: inputs/measurements.csv
    provenance: {origin: user}
  - id: background
    role: reference
    kind: directory
    source: papers
    description: Background reference
    audiences: [solver, evaluator, controller]
    target: papers
    provenance: {origin: user}
outputs:
  state: specified
  items:
    - path: report.md
      required: true
      provenance: {origin: user, evidence: goal}
evaluation: {state: none}
