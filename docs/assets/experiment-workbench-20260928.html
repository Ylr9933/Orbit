function renderList(){app.innerHTML=`<div class="heading"><div><div class="eyebrow">EXPERIMENTS</div><h1>实验</h1><p class="muted small">查看结果，比较改动，回到每一次执行。</p></div></div><div class="toolbar"><span class="counter">1 个实验</span><span class="muted small">真实 ASI 结果快照</span></div><div class="table-box list-table"><div class="table-scroll"><table><thead><tr><th>实验</th><th>模型</th><th class="num">平均分</th><th>有效评分</th><th>状态</th></tr></thead><tbody><tr class="list-row"><td><a class="task-name" href="#batch">ASI-Bench · b3</a><div class="meta">seed31415 · 60 个任务</div></td><td>gpt-6-sol <span class="muted">/ medium</span></td><td class="num">${fmt(D.mean)}</td><td>60 / 60</td><td><span class="badge">✓ 已完成</span></td></tr></tbody></table></div></div><div class="footer"><span>实验配置与单任务证据在详情中查看。</span><span>本地公开评分</span></div>`;}
function summary(){return `<div class="summary"><div class="stat"><div class="stat-label">平均分 <span class="muted">/ 100</span></div><div class="number">${fmt(D.mean)}</div><div class="stat-note">中位数 ${fmt(D.median)} · 60 个有效评分</div></div><div class="stat"><div class="stat-label">有效评分</div><div class="number">60 <small>/ 60</small></div><div class="stat-note">全部完成 · 0 个运行失败</div></div><div class="stat"><div class="stat-label">零分任务</div><div class="number">${D.zero} <small>项</small></div><button class="text-button" id="show-zero">查看这 ${D.zero} 项 →</button></div><div class="stat"><div class="stat-label">单任务运行耗时中位数</div><div class="number">${Math.round(D.median_duration/60)} <small>分钟</small></div><div class="stat-note">实测运行耗时 · 非任务时限</div></div></div>`;}
function renderBatch(){app.innerHTML=`<div class="heading"><div><div class="eyebrow">BENCHMARK EXPERIMENT</div><div class="title-line"><h1>ASI-Bench · b3</h1><span class="badge">✓ 已完成</span></div><div class="meta"><span>gpt-6-sol</span><span>medium</span><span>seed31415</span><span>Codex 0.157.1</span><span class="pill">60 个任务</span></div></div><div class="actions"><button class="btn" id="compare-top">⇄ 比较实验</button><button class="btn" id="export">↓ 导出结果</button></div></div>${summary()}<div class="tabs">${[['results','任务结果'],['distribution','得分分布'],['comparison','实验比较']].map(([k,n])=>`<button data-tab="${k}" class="${k===tab?'selected':''}" aria-pressed="${k===tab}">${n}</button>`).join('')}</div><div id="tab-content"></div><div class="footer"><span>本地公开评分 · ${D.snapshot_at} 快照</span><span>平均分采用完整任务集；筛选只改变列表。</span></div>`;document.getElementById('show-zero').onclick=()=>{scoreFilter='zero';tab='results';page=0;renderBatch()};document.getElementById('compare-top').onclick=()=>{tab='comparison';renderBatch()};document.getElementById('export').onclick=exportCSV;for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{tab=b.dataset.tab;renderBatch()};renderTab();}
function renderTab(){if(tab==='results'){document.getElementById('tab-content').innerHTML=`<div id="selection"></div><div class="toolbar"><div class="search-wrap"><span>⌕</span><label class="sronly" for="search">搜索任务</label><input class="search" id="search" placeholder="搜索任务名称…" value="${esc(query)}"></div><div class="filters"><label class="sronly" for="domain">任务领域</label><select id="domain"><option value="">全部领域</option>${Object.entries(domains).map(([k,n])=>`<option value="${k}" ${domain===k?'selected':''}>${n}</option>`).join('')}</select><label class="sronly" for="scorefilter">得分筛选</label><select id="scorefilter"><option value="">全部得分</option><option value="zero" ${scoreFilter==='zero'?'selected':''}>零分</option><option value="low" ${scoreFilter==='low'?'selected':''}>低于 20 分</option><option value="full" ${scoreFilter==='full'?'selected':''}>满分</option></select><label class="sronly" for="sort">任务排序</label><select id="sort"><option value="score" ${sort==='score'?'selected':''}>得分从低到高</option><option value="high" ${sort==='high'?'selected':''}>得分从高到低</option><option value="time" ${sort==='time'?'selected':''}>耗时从长到短</option><option value="name" ${sort==='name'?'selected':''}>任务名称</option></select></div></div><div id="table"></div>`;document.getElementById('search').oninput=e=>{query=e.target.value;page=0;renderTable()};for(const id of ['domain','scorefilter','sort'])document.getElementById(id).onchange=e=>{if(id==='domain')domain=e.target.value;else if(id==='scorefilter')scoreFilter=e.target.value;else sort=e.target.value;page=0;renderTable()};renderTable();}else if(tab==='distribution')renderDistribution();else document.getElementById('tab-content').innerHTML=`<div class="empty"><div class="empty-icon">⇄</div><h2>选择另一组实验，开始比较</h2><p>当前原型只有一组真实 ASI 结果。接入另一组实验后，在共同任务上查看分数变化、配置差异与执行轨迹。</p><button class="btn" onclick="tab='results';renderBatch()">返回任务结果</button></div>`;}
function filtered(){return D.rows.filter(r=>(!query||`${r.unit} ${r.name} ${domains[r.domain]}`.toLowerCase().includes(query.toLowerCase()))&&(!domain||r.domain===domain)&&(!scoreFilter||(scoreFilter==='zero'?r.score===0:scoreFilter==='full'?r.score===100:r.score<20))).sort((a,b)=>sort==='score'?a.score-b.score||a.unit.localeCompare(b.unit):sort==='high'?b.score-a.score:sort==='time'?(b.elapsed??0)-(a.elapsed??0):a.unit.localeCompare(b.unit));}
function renderTable(){const rows=filtered();const totalPages=Math.max(1,Math.ceil(rows.length/20));page=Math.min(page,totalPages-1);const shown=rows.slice(page*20,(page+1)*20);document.getElementById('selection').innerHTML=selected.size?`<div class="selected-bar"><span class="small">已选择 <strong>${selected.size}</strong> 个任务</span><div class="actions"><button class="btn" id="clear-selected">取消选择</button><button class="btn primary" id="retry-selected">查看重跑方案</button></div></div>`:'';if(selected.size){document.getElementById('clear-selected').onclick=()=>{selected.clear();renderTable()};document.getElementById('retry-selected').onclick=openRetry;}document.getElementById('table').innerHTML=`<div class="table-box"><div class="table-scroll"><table><thead><tr><th class="checkbox"><input id="select-page" type="checkbox" aria-label="选择当前页任务"></th><th>任务</th><th>领域</th><th class="num">得分 / 100</th><th>评分状态</th><th class="num">运行耗时</th><th><span class="sronly">操作</span></th></tr></thead><tbody>${shown.map(r=>`<tr><td class="checkbox"><input data-check="${r.id}" type="checkbox" aria-label="选择 ${esc(r.name)}" ${selected.has(r.id)?'checked':''}></td><td><a class="task-name" title="${esc(r.unit)}" href="#task/${r.id}">${esc(r.name)}</a></td><td class="domain">${domains[r.domain]}</td><td class="num"><div class="score"><div class="score-track" aria-hidden="true"><div class="score-fill" style="width:${r.score}%"></div></div><strong class="${r.score===0?'zero':''}">${fmt(r.score)}</strong></div></td><td><span class="run-status">✓ 已评分</span></td><td class="num muted">${duration(r.elapsed)}</td><td><a href="#task/${r.id}" aria-label="查看 ${esc(r.name)} 详情">↗</a></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty" style="border:0;padding:35px"><h3>没有匹配的任务</h3><button class="btn" id="clear-filters">清除筛选</button></div></td></tr>'}</tbody></table></div><div class="table-foot"><span id="filter-status" role="status">显示 ${rows.length? page*20+1:0}–${Math.min((page+1)*20,rows.length)} 项，共 ${rows.length} / 60 个任务</span><div class="actions"><button class="btn" id="prev" ${page===0?'disabled':''}>上一页</button><span>${page+1} / ${totalPages}</span><button class="btn" id="next" ${page===totalPages-1?'disabled':''}>下一页</button></div></div></div>`;document.getElementById('prev').onclick=()=>{page--;renderTable()};document.getElementById('next').onclick=()=>{page++;renderTable()};for(const cb of document.querySelectorAll('[data-check]'))cb.onchange=()=>{const n=Number(cb.dataset.check);cb.checked?selected.add(n):selected.delete(n);renderTable()};const all=document.getElementById('select-page');all.checked=shown.length>0&&shown.every(r=>selected.has(r.id));all.indeterminate=shown.some(r=>selected.has(r.id))&&!all.checked;all.onchange=()=>{for(const r of shown)all.checked?selected.add(r.id):selected.delete(r.id);renderTable()};if(document.getElementById('clear-filters'))document.getElementById('clear-filters').onclick=()=>{query=domain=scoreFilter='';page=0;renderTab()};}
function openRetry(){document.getElementById('retry-count').textContent=`已选择 ${selected.size} 个任务 · 沿用当前实验配置`;document.getElementById('retry-parallel').textContent=`${Math.min(6,selected.size)} 个任务`;document.getElementById('retry-dialog').showModal();}
function exportCSV(){const rows=filtered();const q=x=>'"'+String(x??'').replaceAll('"','""')+'"';const csv='\uFEFF'+[['task','local_public_score','elapsed_seconds','evaluation'],...rows.map(r=>[r.unit,r.score,r.elapsed,r.evaluation])].map(row=>row.map(q).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='asi-b3-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function renderDistribution(){const bins=Array(10).fill(0);D.rows.forEach(r=>bins[Math.min(9,Math.floor(r.score/10))]++);const max=Math.max(...bins);document.getElementById('tab-content').innerHTML=`<div class="panel"><h2>60 个任务的得分分布</h2><p class="caption">平均分 ${fmt(D.mean)}，中位数 ${fmt(D.median)}；分布反映任务差异，不代表运行故障。</p><div class="distribution" role="img" aria-label="得分直方图。各区间任务数量：${bins.join(', ')}">${bins.map((n,i)=>`<div class="bin"><span>${n} 项</span><div class="bar" style="height:${n/max*160}px"></div><span class="dist-label">${i*10}–${(i+1)*10}${i===9?'': '分'}</span></div>`).join('')}</div><p class="caption">区间左闭右开，最后一区间包含 100 分。</p><button class="btn" onclick="scoreFilter='low';tab='results';page=0;renderBatch()">查看低于 20 分的任务</button></div>`;}
function renderTask(id){const r=D.rows.find(x=>x.id===id);if(!r){location.hash='batch';return;}document.getElementById('crumb').innerHTML+='<span class="slash">/</span><span>任务详情</span>';app.innerHTML=`<a class="back" href="#batch">← 返回任务结果</a><div class="heading"><div><h1 class="detail-name">${esc(r.name)}</h1><div class="meta"><span>${domains[r.domain]}</span><span>seed31415 · b3</span><span>gpt-6-sol / medium</span><span class="badge">✓ 已评分</span></div></div><div class="actions"><button class="btn" id="retry-one">查看重跑方案</button></div></div><div class="tabs">${[['result','结果'],['trace','Agent 轨迹'],['files','文件'],['config','配置']].map(([k,n])=>`<button data-detail="${k}" aria-pressed="${k==='result'}" class="${k==='result'?'selected':''}">${n}</button>`).join('')}</div><div id="detail"></div>`;document.getElementById('retry-one').onclick=()=>{selected.clear();selected.add(id);openRetry()};for(const b of document.querySelectorAll('[data-detail]'))b.onclick=()=>{for(const x of document.querySelectorAll('[data-detail]')){x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))}taskTab(r,b.dataset.detail)};taskTab(r,'result');}
function taskTab(r,t){const root=document.getElementById('detail');if(t==='result')root.innerHTML=`<div class="panels"><section class="panel"><div class="stat-label">本地公开评分</div><div class="detail-score">${fmt(r.score)} <small>/ 100</small></div><span class="badge">✓ 评分有效</span><p class="caption">结果由 ASI 原生公开评分流程生成。</p><div class="note">${r.score===0?'该任务已成功完成评分，得分为 0。需要结合评分细项和提交内容解释原因。':'查看评分证据与提交内容，了解这个分数对应的结果。'}</div></section><section class="panel"><h2>执行概况</h2><dl><dt>运行耗时</dt><dd>${duration(r.elapsed)}</dd><dt>单任务时限</dt><dd>180 分钟</dd><dt>Agent 轨迹</dt><dd>${r.trace_steps??'—'} 步（归档记录）</dd><dt>归档文件</dt><dd>${r.file_count} 个</dd><dt>执行状态</dt><dd>已完成</dd><dt>评分状态</dt><dd>有效</dd></dl></section></div>`;else if(t==='trace')root.innerHTML=`<div class="panels"><section class="panel"><h2>轨迹阅读区</h2><p class="caption">${r.trace_steps??'—'} 个归档步骤 · ${r.tool_calls??'—'} 次工具调用</p><div class="trace-placeholder">本原型展示真实的轨迹统计，未嵌入消息正文。<br>正式界面按时间展示 Agent 消息、命令、输出与文件修改。</div><div class="note">正文按步骤加载；长输出默认折叠，错误可直接定位。内容缺失或截断时明确显示。</div></section><section class="panel"><h2>采集信息</h2><dl><dt>轨迹覆盖</dt><dd>${esc(r.trace_capture)}</dd><dt>证据覆盖</dt><dd>${esc(r.capture)}</dd><dt>记录来源</dt><dd>原生 Codex + ASI 归档</dd></dl><p class="caption">展示范围与底层采集能力一致。</p></section></div>`;else if(t==='files')root.innerHTML=`<div class="panel"><h2>归档文件 <span class="muted small">${r.file_count} 个</span></h2><p class="caption">来自真实 Records 清单。原型仅展示文件路径；正式版使用现有预览和下载接口。</p>${r.files.map(f=>`<div class="file"><span>${esc(f)}</span><span class="muted">已归档</span></div>`).join('')}</div>`;else root.innerHTML=`<div class="panel"><h2>实验配置</h2><dl><dt>Benchmark</dt><dd>ASI-Bench · b3 · seed31415</dd><dt>模型</dt><dd>gpt-6-sol</dd><dt>思考强度</dt><dd>medium</dd><dt>Codex</dt><dd>0.157.1</dd><dt>单任务资源</dt><dd>4 CPU / 8 GiB · 无 GPU</dd><dt>单任务时限</dt><dd>180 分钟</dd><dt>任务标识</dt><dd>${esc(r.unit)}</dd></dl><details style="margin-top:24px"><summary class="small">技术信息</summary><dl><dt>Run ID</dt><dd>${r.run_id}</dd><dt>外层预算</dt><dd>182 分钟（包括额外 120 秒执行开销预算）</dd></dl></details></div>`;}
function renderAux(path){const resource=path==='resources';document.getElementById('crumb').textContent=resource?'资源':'设置';app.innerHTML=`<div class="heading"><div><h1>${resource?'资源':'设置'}</h1><p class="muted small">${resource?'运行时的机器与资源状态。':'Agent、认证、默认配置与其他工作区入口。'}</p></div></div><div class="empty"><div class="empty-icon">${resource?'▥':'⚙'}</div><h2>本轮先聚焦实验工作台</h2><p>${resource?'正式版复用现有主机资源页面。本原型未连接宿主机监控，不展示模拟的实时数据。':'科研工作区与高级诊断保留入口；这轮先确认实验结果、任务复盘和比较的使用方式。'}</p><a class="btn" href="#batch">查看 ASI 实验</a></div>`;}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});route();
</script></body></html>
