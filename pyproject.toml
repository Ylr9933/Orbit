[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[project]
name = "agent-infra"
version = "0.1.0"
description = "Modular foundations for agent and environment infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
agent-infra = "agent_infra.bootstrap.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.5,<3",
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
    "types-pyyaml>=6.0.12,<7",
]

[tool.uv]
required-version = "==0.12.10"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agent_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "integration: external service integration (explicit opt-in)",
    "e2e: real end-to-end workflows (explicit opt-in)",
]

[tool.importlinter]
root_package = "agent_infra"

[[tool.importlinter.contracts]]
name = "Functional dependency direction"
type = "layers"
containers = ["agent_infra"]
exhaustive = true
layers = [
    "bootstrap",
    "gateways",
    "projects",
    "runs",
    "agents | tasks",
    "environments | resources",
    "records",
    "contracts",
]
